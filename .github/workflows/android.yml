name: Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    name: Build debug-signed APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/onorab-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/onorab-mobile/package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/onorab-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: onorab-android-debug
          path: apps/onorab-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
